redis:
  hostname: "" # to be set by the mission
  port: 6379
  job_queue: "ranges"
  success_queue: "succeeded"
  failed_queue: "failed"
  progress_queue: "in_progress"
  metrics: "metrics"
  job_owners: "job_owners"
  resources:
    requests:
      cpu: "100m"
      memory: "100Mi"

worker:
  stellar_core_image: "stellar/stellar-core:latest"
  replicas: 5
  # dataStorageClass: "" -> /data is an emptyDir on instance NVMe (default).
  # Set to an EBS StorageClass name -> /data becomes a per-worker PVC that
  # survives pod restart (enables catchup resume). dataStorageSize sizes it.
  dataStorageClass: ""
  dataStorageSize: "50Gi"
  # resumeSkipNewDb: true -> worker.sh skips new-db when a DB already exists on
  # /data (a restored PVC), so catchup resumes instead of re-running the range.
  resumeSkipNewDb: true
  requireNodeLabels: []
  avoidNodeLabels: []
  tolerateNodeTaints: []
  asanOptions: "quarantine_size_mb=1:malloc_context_size=5:alloc_dealloc_mismatch=0"
  resources: # resources below are left empty on purpose, they are read and overridden from `StellarKubeCfg.fs`
    requests:
      cpu: ""
      memory: ""
      ephemeral_storage: ""
    limits:
      cpu: ""
      memory: ""
      ephemeral_storage: ""
  historyGetCommandCore001:
    "curl -sf http://history.stellar.org/prd/core-live/core_live_001/{0} -o {1}"
  historyGetCommandCore002:
    "curl -sf http://history.stellar.org/prd/core-live/core_live_002/{0} -o {1}"
  historyGetCommandCore003:
    "curl -sf http://history.stellar.org/prd/core-live/core_live_003/{0} -o {1}"

monitor:
  gateway_name: "traefik-gateway-private"
  gateway_namespace: "traefik"
  hostname: "" # to be set by the mission
  path_prefix: "/default"
  logging_interval_seconds: 300
  logging_level: "INFO" # 'DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'
  resources:
    requests:
      cpu: "100m"
      memory: "100Mi"

range_generator:
  strategy: "uniform" # "uniform" or "logarithmic"
  params:
    starting_ledger: 0
    latest_ledger_num: 100000
    overlap_ledgers: 320
    uniform_ledgers_per_job: 16000 # only for strategy="uniform"
    logarithmic_floor_ledgers: 16000 # only for strategy="logarithmic"

service_account:
  annotations: []

# Idle-worker reaper: neuters idle workers at the tail of a run so Karpenter can
# reap their nodes. See files/reaper.py and templates/reaper_rbac.yaml.
reaper:
  enabled: false
  image: "stellar/ssc-catchup-reaper:latest"
  # TEST ONLY: run on a stock python image and pip-install deps at pod start,
  # so the reaper can be exercised before the image pipeline exists. Set the
  # image to python:3.12-alpine when enabling this.
  installDepsAtStartup: false
  # Observe-only. Logs every decision without touching pods or PVCs.
  dryRun: true
  # Never scale below this many workers, so a requeued job is not starved.
  minWorkers: 8
  # An idle verdict must hold this long before a worker is neutered.
  confirmIntervalSeconds: 30
  pollIntervalSeconds: 30
  maxReapsPerCycle: 64
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
